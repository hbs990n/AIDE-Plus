# 2.2 分支的自动编译：push 到该分支即触发
name: Build AIDE-Plus 2.2 APK

on:
  push:
    branches:
      - 2.2
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      # ubuntu-latest 已自带 Android SDK，不要再跑 setup-android@v3：
      # 它会尝试安装早已废弃的 `tools` 包并失败。
      - name: Ensure Android SDK platform 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$PATH:$SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      # 这份 2.2 源码是很多年前的 AIDE 工程：settings.gradle 指向不存在的 :app，
      # 没有 gradlew，仓库用的是已关停的 jcenter/bintray，AGP 还是 1.+。
      # 这里在 CI 里做非侵入式补丁，只影响 Runner 上的临时副本，不改仓库源码。
      - name: Patch legacy project for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          Path('settings.gradle').write_text(
              "rootProject.name = 'AIDE-Plus'\n"
              "include ':appAideBase'\n"
              "include ':app_rewrite'\n"
          )

          Path('build.gradle').write_text("""buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://jitpack.io' }
              }
          }
          """)

          Path('gradle.properties').write_text(
              "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n"
              "android.useAndroidX=true\n"
              "android.enableJetifier=false\n"
          )

          # appAideBase 与 app_rewrite 的资源是「底包 + 覆盖层」关系，
          # 直接作为两个 res 目录交给 AGP 会因为同名资源报错。
          # 这里在 CI 副本里先合并成一棵树：app_rewrite 的定义覆盖 base。
          import shutil
          from xml.etree import ElementTree as ET

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools', 'http://schemas.android.com/tools')

          BASE_RES = Path('appAideBase/src/main/res')
          RW_RES = Path('app_rewrite/src/main/res')
          MERGED = Path('.ci-res')
          if MERGED.exists():
              shutil.rmtree(MERGED)
          shutil.copytree(BASE_RES, MERGED)

          def res_key(el):
              tag = el.tag.split('}')[-1]
              name = el.get('name')
              if not name:
                  return None
              if tag == 'item' and el.get('type'):
                  return (el.get('type'), name)
              return (tag, name)

          # 收集 app_rewrite 在每个 values* 限定符下定义的资源键
          rw_keys = {}
          for p in RW_RES.rglob('*'):
              if not p.is_file():
                  continue
              q = p.relative_to(RW_RES).parts[0]
              if not q.startswith('values'):
                  continue
              try:
                  root = ET.parse(p).getroot()
              except ET.ParseError:
                  continue
              keys = rw_keys.setdefault(q, set())
              for el in list(root):
                  k = res_key(el)
                  if k:
                      keys.add(k)

          # 先从合并树里删掉被覆盖的定义
          for p in list(MERGED.rglob('*')):
              if not p.is_file():
                  continue
              q = p.relative_to(MERGED).parts[0]
              if not q.startswith('values') or q not in rw_keys:
                  continue
              try:
                  tree = ET.parse(p)
              except ET.ParseError:
                  continue
              root = tree.getroot()
              changed = False
              for el in list(root):
                  k = res_key(el)
                  if k and k in rw_keys[q]:
                      root.remove(el)
                      changed = True
              if changed:
                  tree.write(p, encoding='utf-8', xml_declaration=True)

          # 再把 app_rewrite 的资源覆盖进去
          for p in RW_RES.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(RW_RES)
              q = rel.parts[0]
              target = MERGED / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              if q.startswith('values') and target.exists():
                  try:
                      src_root = ET.parse(p).getroot()
                      dst_tree = ET.parse(target)
                      dst_root = dst_tree.getroot()
                  except ET.ParseError:
                      shutil.copy2(p, target)
                      continue
                  existing = {k for el in list(dst_root) if (k := res_key(el))}
                  for el in list(src_root):
                      k = res_key(el)
                      if k and k in existing:
                          continue
                      dst_root.append(el)
                  dst_tree.write(target, encoding='utf-8', xml_declaration=True)
              else:
                  # 非 values 资源：同名同限定符的文件只能留一份
                  for old in target.parent.glob(p.stem + '.*'):
                      if old != target:
                          old.unlink()
                  shutil.copy2(p, target)

          # 底包自带的 public.xml 里有重复 <public> 声明，AGP 8 的 AAPT2 不接受
          seen_keys = {}
          for p in sorted(MERGED.rglob('*')):
              if not p.is_file():
                  continue
              q = p.relative_to(MERGED).parts[0]
              if not q.startswith('values'):
                  continue
              try:
                  tree = ET.parse(p)
              except ET.ParseError:
                  continue
              root = tree.getroot()
              seen = seen_keys.setdefault(q, set())
              changed = False
              for el in reversed(list(root)):
                  k = res_key(el)
                  if k and k in seen:
                      root.remove(el)
                      changed = True
                  elif k:
                      seen.add(k)
              if changed:
                  tree.write(p, encoding='utf-8', xml_declaration=True)

          def patch_module(path, namespace, is_app):
              p = Path(path) / 'build.gradle'
              s = p.read_text(encoding='utf-8')

              s = s.replace("compileSdkVersion 21", "compileSdkVersion 34")
              s = re.sub(r'(?m)^\s*buildToolsVersion\s+.*\n', '', s)
              s = re.sub(r'(?m)^\s*ndkVersion\s+.*\n', '', s)

              if not is_app:
                  s = s.replace("apply plugin: 'com.android.application'",
                                "apply plugin: 'com.android.library'")
                  s = re.sub(r'(?m)^\s*applicationId\s+.*\n', '', s)

              s = re.sub(r'(?m)^(\s*)compile\s+', r'\1implementation ', s)
              if is_app:
                  s = re.sub(r'(?m)^(\s*)api\s+', r'\1implementation ', s)

              # 原写法 include: ['.jar'] 匹配不到任何 jar
              s = s.replace("include: ['.jar']", "include: ['*.jar']")

              # 两个模块的资源几乎是同一套（app_rewrite 是覆盖层）。
              # 作为 library 的 appAideBase 不能再把这些资源打进 AAR，
              # 否则和 app_rewrite 的同名资源在 AGP 8 下会冲突。
              # 改为在 app_rewrite 里把 base 资源当低优先级 res 目录合并。
              if is_app:
                  resources = (
                      "    sourceSets {\n"
                      "        main {\n"
                      "            res.srcDirs = ['../.ci-res']\n"
                      "        }\n"
                      "    }\n"
                  )
              else:
                  resources = (
                      "    sourceSets {\n"
                      "        main {\n"
                      "            res.srcDirs = []\n"
                      "        }\n"
                      "    }\n"
                  )
              s = s.replace(
                  'android {',
                  "android {\n"
                  "    namespace '%s'\n"
                  "    compileOptions {\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17\n"
                  "    }\n%s" % (namespace, resources),
                  1,
              )
              p.write_text(s, encoding='utf-8')

          patch_module('appAideBase', 'com.aide.ui.base', False)
          patch_module('app_rewrite', 'com.aide.ui.rewrite', True)

          # 两个模块都带 res/xml/file_paths.xml，文件型资源不允许覆盖，
          # app_rewrite 的版本是超集，base 的那份在 CI 副本里删掉。
          Path('appAideBase/src/main/res/xml/file_paths.xml').unlink(missing_ok=True)

          # AGP 8 不允许 manifest 里再写 package 属性
          m = Path('app_rewrite/src/main/AndroidManifest.xml')
          s = m.read_text(encoding='utf-8')
          s = re.sub(r'\s*package="[^"]*"', '', s, count=1)
          m.write_text(s, encoding='utf-8')
          PY

      - name: Build release APK
        run: gradle :app_rewrite:assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIDE-Plus-2.2
          path: app_rewrite/build/outputs/apk/release/*.apk
          if-no-files-found: error
